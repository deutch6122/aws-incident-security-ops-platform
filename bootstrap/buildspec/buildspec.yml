# ---------------------------------------------------------------------------
# buildspec.yml（ディスパッチャ）
# ---------------------------------------------------------------------------
# CodePipeline の各 CodeBuild アクションが渡す環境変数 STAGE（fmt/validate/plan/apply）
# に応じて処理を分岐する。個別の buildspec-*.yml と同等の処理をまとめたもの。
# 順序（パイプライン側で担保）: fmt -> validate -> plan -> 手動承認 -> apply。
# 対応要件: Req 21.3, 21.4, 23.1, 23.2, 23.3
#
# 権限分離（AssumeRole 分離設計）:
#   CodeBuild の service_role は codebuild-role。Terraform 実行時は codebuild-role が
#   terraform-exec-role（$TERRAFORM_EXEC_ROLE_ARN）を sts:AssumeRole し、取得した
#   一時クレデンシャルを AWS_ACCESS_KEY_ID/SECRET/SESSION_TOKEN に export してから
#   terraform を実行する。fmt はローカル処理のため assume 不要。
# ---------------------------------------------------------------------------
version: 0.2

env:
  variables:
    TF_WORKDIR: "infra/environments/dev"
    # STAGE は CodePipeline アクションの EnvironmentVariables で上書きされる。
    STAGE: "plan"

phases:
  install:
    commands:
      # jq は一時クレデンシャルの JSON パースに使用する（標準イメージには同梱。
      # 無い場合は `yum install -y jq` 等で導入する）。
      - |
        jq --version || echo "jq is not installed. Install it in the install phase if needed."
      - |
        set -euo pipefail
        TF_VERSION="$(tr -d '[:space:]' < .terraform-version)"
        TF_ARCHIVE="terraform_${TF_VERSION}_linux_amd64.zip"
        TF_CHECKSUM="$(awk -v archive="$TF_ARCHIVE" '$2 == archive {print $1}' .terraform-version.checksums)"
        test -n "$TF_CHECKSUM"
        curl -fsSLo "/tmp/$TF_ARCHIVE" "https://releases.hashicorp.com/terraform/${TF_VERSION}/$TF_ARCHIVE"
        echo "$TF_CHECKSUM  /tmp/$TF_ARCHIVE" | sha256sum -c -
        unzip -oq "/tmp/$TF_ARCHIVE" -d /tmp/terraform-bin
        install /tmp/terraform-bin/terraform /usr/local/bin/terraform
        test "$(terraform version -json | jq -r .terraform_version)" = "$TF_VERSION"
        terraform version
  build:
    commands:
      - |
        set -euo pipefail
        echo "=== STAGE=${STAGE} ==="

        # terraform-exec-role を assume して一時クレデンシャルを export する関数。
        # validate/plan/apply など AWS 認証が必要なステージの前に呼び出す。
        assume_terraform_exec() {
          echo "--- assume terraform-exec-role (${TERRAFORM_EXEC_ROLE_ARN}) ---"
          CREDS=$(aws sts assume-role \
            --role-arn "$TERRAFORM_EXEC_ROLE_ARN" \
            --role-session-name "tf-${STAGE}" \
            --query 'Credentials' --output json)
          export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .AccessKeyId)
          export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .SecretAccessKey)
          export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .SessionToken)
        }

        case "${STAGE}" in
          fmt)
            # fmt は terraform fmt のローカル処理のみで AWS 認証は不要（assume しない）。
            echo "--- terraform fmt -check -recursive ---"
            terraform -chdir="$TF_WORKDIR" fmt -check -recursive
            ;;
          validate)
            echo "--- terraform init & validate ---"
            assume_terraform_exec
            terraform -chdir="$TF_WORKDIR" init -input=false -lockfile=readonly -backend-config="bucket=$TF_BACKEND_BUCKET"
            terraform -chdir="$TF_WORKDIR" validate
            ;;
          plan)
            echo "--- terraform init & plan ---"
            COMMIT_SHA="${CODEBUILD_RESOLVED_SOURCE_VERSION:-}"
            [[ "$COMMIT_SHA" =~ ^[0-9a-f]{7,64}$ ]] || { echo "invalid source commit SHA" >&2; exit 1; }
            apps/portal-lambda/build.sh
            PACKAGE_FILE="apps/portal-lambda/dist/portal-api.zip"
            PACKAGE_KEY="lambda/${COMMIT_SHA}/portal-api.zip"
            PACKAGE_HASH="$(openssl dgst -sha256 -binary "$PACKAGE_FILE" | openssl base64 -A)"
            PACKAGE_VERSION="$(aws s3api put-object --bucket "$ARTIFACT_BUCKET" --key "$PACKAGE_KEY" --body "$PACKAGE_FILE" --server-side-encryption aws:kms --ssekms-key-id "$ARTIFACT_KMS_KEY_ARN" --metadata "source-code-hash=$PACKAGE_HASH" --query VersionId --output text)"
            test -n "$PACKAGE_VERSION" && test "$PACKAGE_VERSION" != "None"
            export TF_VAR_lambda_package_s3_bucket="$ARTIFACT_BUCKET" TF_VAR_lambda_package_s3_key="$PACKAGE_KEY" TF_VAR_lambda_package_s3_object_version="$PACKAGE_VERSION" TF_VAR_lambda_source_code_hash="$PACKAGE_HASH"
            export TF_VAR_alb_certificate_arn="$(aws ssm get-parameter --name "$SSM_ALB_CERTIFICATE_ARN" --query Parameter.Value --output text)"
            export TF_VAR_network_allowed_alb_ingress_cidrs="$(aws ssm get-parameter --name "$SSM_ALB_INGRESS_CIDRS" --query Parameter.Value --output text)"
            export TF_VAR_eks_operator_principal_arn="$(aws ssm get-parameter --name "$SSM_EKS_OPERATOR_PRINCIPAL_ARN" --query Parameter.Value --output text)"
            export TF_VAR_migration_launcher_trusted_principal_arns="$(aws ssm get-parameter --name "$SSM_MIGRATION_LAUNCHER_PRINCIPALS" --query Parameter.Value --output text)"
            export TF_VAR_eks_public_access_cidrs="$(aws ssm get-parameter --name "$SSM_EKS_PUBLIC_ACCESS_CIDRS" --query Parameter.Value --output text)"
            export TF_VAR_application_image_tag="$(aws ssm get-parameter --name "$SSM_APPLICATION_IMAGE_TAG" --query Parameter.Value --output text)"
            export TF_VAR_ecs_desired_count="$(aws ssm get-parameter --name "$SSM_ECS_DESIRED_COUNT" --query Parameter.Value --output text)"
            export TF_VAR_cognito_callback_urls="$(aws ssm get-parameter --name "$SSM_COGNITO_CALLBACK_URLS" --query Parameter.Value --output text)"
            export TF_VAR_cognito_logout_urls="$(aws ssm get-parameter --name "$SSM_COGNITO_LOGOUT_URLS" --query Parameter.Value --output text)"
            export TF_VAR_cognito_keep_localhost_urls="$(aws ssm get-parameter --name "$SSM_COGNITO_KEEP_LOCALHOST_URLS" --query Parameter.Value --output text)"
            export TF_VAR_monitoring_enable_sns_subscription="$(aws ssm get-parameter --name "$SSM_MONITORING_ENABLE_SNS_SUBSCRIPTION" --query Parameter.Value --output text)"
            export TF_VAR_monitoring_notification_endpoint="$(aws ssm get-parameter --name "$SSM_MONITORING_NOTIFICATION_PARAMETER_NAME" --query Parameter.Value --output text)"
            export TF_VAR_monitoring_notification_protocol="$(aws ssm get-parameter --name "$SSM_MONITORING_NOTIFICATION_PROTOCOL" --query Parameter.Value --output text)"
            [[ "$TF_VAR_application_image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "invalid application image tag" >&2; exit 1; }
            [[ "$TF_VAR_ecs_desired_count" == "0" || "$TF_VAR_ecs_desired_count" == "1" ]] || { echo "ecs desired count must be 0 or 1" >&2; exit 1; }
            [[ "$TF_VAR_cognito_keep_localhost_urls" == "true" || "$TF_VAR_cognito_keep_localhost_urls" == "false" ]] || { echo "invalid Cognito localhost flag" >&2; exit 1; }
            [[ "$TF_VAR_monitoring_enable_sns_subscription" == "true" || "$TF_VAR_monitoring_enable_sns_subscription" == "false" ]] || { echo "invalid monitoring subscription flag" >&2; exit 1; }
            [[ "$TF_VAR_monitoring_notification_protocol" == "email" || "$TF_VAR_monitoring_notification_protocol" == "email-json" || "$TF_VAR_monitoring_notification_protocol" == "https" ]] || { echo "invalid monitoring notification protocol" >&2; exit 1; }
            assume_terraform_exec
            terraform -chdir="$TF_WORKDIR" init -input=false -lockfile=readonly -backend-config="bucket=$TF_BACKEND_BUCKET"
            terraform -chdir="$TF_WORKDIR" plan -input=false -out=tfplan.binary
            terraform -chdir="$TF_WORKDIR" show -no-color tfplan.binary > "$TF_WORKDIR/plan-summary.txt"
            LOCK_HASH="$(sha256sum "$TF_WORKDIR/.terraform.lock.hcl" | awk '{print $1}')"
            jq -n --arg bucket "$ARTIFACT_BUCKET" --arg key "$PACKAGE_KEY" --arg version "$PACKAGE_VERSION" --arg hash "$PACKAGE_HASH" --arg lock_hash "$LOCK_HASH" --arg terraform_version "$(terraform version -json | jq -r .terraform_version)" --arg commit "$COMMIT_SHA" '{bucket:$bucket,key:$key,version:$version,source_code_hash:$hash,lock_sha256:$lock_hash,terraform_version:$terraform_version,commit:$commit}' > "$TF_WORKDIR/lambda-package-metadata.json"
            echo "--- 作成/変更/削除予定リソース（抜粋） (Req 23.1) ---"
            grep -E "will be (created|updated|destroyed|replaced)" "$TF_WORKDIR/plan-summary.txt" || true
            echo "===================================================================="
            echo "[コスト影響が大きいリソース] Aurora / NAT / EKS / CloudFront (Req 23.2)"
            echo "===================================================================="
            grep -E "aws_rds_cluster|aws_nat_gateway|aws_eks_cluster|aws_eks_fargate_profile|aws_cloudfront_distribution" "$TF_WORKDIR/plan-summary.txt" || echo "(コスト影響大リソースの変更なし)"
            ;;
          apply)
            # このステージは手動承認の「後」にのみ到達する (Req 21.4, 23.3)。
            # PrimarySource=source_output（コード一式）が作業ディレクトリ。
            # 承認済み plan バイナリはセカンダリソース plan_output から参照する。
            echo "--- terraform init & apply (承認済み plan を適用) ---"
            assume_terraform_exec
            PLAN_SRC_DIR_VAR="CODEBUILD_SRC_DIR_${PLAN_ARTIFACT_NAME:-plan_output}"
            PLAN_SRC_DIR="${!PLAN_SRC_DIR_VAR:-}"
            test -n "$PLAN_SRC_DIR"
            PLAN_FILE="$PLAN_SRC_DIR/$TF_WORKDIR/tfplan.binary"
            PLAN_LOCK="$PLAN_SRC_DIR/$TF_WORKDIR/.terraform.lock.hcl"
            PACKAGE_METADATA="$PLAN_SRC_DIR/$TF_WORKDIR/lambda-package-metadata.json"
            test -f "$PLAN_FILE" && test -f "$PLAN_LOCK" && test -f "$PACKAGE_METADATA"
            cmp -s "$PLAN_LOCK" "$TF_WORKDIR/.terraform.lock.hcl"
            test "$(sha256sum "$PLAN_LOCK" | awk '{print $1}')" = "$(jq -r .lock_sha256 "$PACKAGE_METADATA")"
            test "$(terraform version -json | jq -r .terraform_version)" = "$(jq -r .terraform_version "$PACKAGE_METADATA")"
            PACKAGE_BUCKET="$(jq -r .bucket "$PACKAGE_METADATA")"; PACKAGE_KEY="$(jq -r .key "$PACKAGE_METADATA")"; PACKAGE_VERSION="$(jq -r .version "$PACKAGE_METADATA")"; PACKAGE_HASH="$(jq -r .source_code_hash "$PACKAGE_METADATA")"
            HEAD_OBJECT_JSON="$(aws s3api head-object --bucket "$PACKAGE_BUCKET" --key "$PACKAGE_KEY" --version-id "$PACKAGE_VERSION" --output json)"
            REMOTE_HASH="$(echo "$HEAD_OBJECT_JSON" | jq -r '.Metadata["source-code-hash"] // empty')"
            test -n "$REMOTE_HASH" || { echo "Lambda package metadata source-code-hash was not found" >&2; exit 1; }
            test "$REMOTE_HASH" = "$PACKAGE_HASH" || { echo "Lambda package source-code-hash mismatch: expected=$PACKAGE_HASH actual=$REMOTE_HASH" >&2; exit 1; }
            echo "Lambda package integrity check: OK"
            echo "適用対象 plan: $PLAN_FILE"
            terraform -chdir="$TF_WORKDIR" init -input=false -lockfile=readonly -backend-config="bucket=$TF_BACKEND_BUCKET"
            # plan バイナリは絶対/相対いずれのパスでも受け付けられるよう解決済みパスを渡す。
            terraform -chdir="$TF_WORKDIR" apply -input=false -auto-approve "$PLAN_FILE"
            ;;
          *)
            echo "unknown STAGE: ${STAGE}" >&2
            exit 1
            ;;
        esac

artifacts:
  files:
    - "infra/environments/dev/tfplan.binary"
    - "infra/environments/dev/plan-summary.txt"
    - "infra/environments/dev/.terraform.lock.hcl"
    - "infra/environments/dev/lambda-package-metadata.json"
