# Worker_Finding. Same security posture as the alarm processor. Environment
# carries only non-secret values; the DB credential is read at runtime via IRSA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-finding-worker
  namespace: workers
  labels:
    app.kubernetes.io/name: security-finding-worker
    app.kubernetes.io/part-of: ops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: security-finding-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-finding-worker
        app.kubernetes.io/part-of: ops-platform
    spec:
      serviceAccountName: eks-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: security-finding-worker
          image: ${ECR_WORKERS_IMAGE}
          command: ["python", "-m", "workers.entrypoints.security_finding_worker"]
          env:
            - name: WORKER_AWS_REGION
              value: ap-northeast-1
            - name: WORKER_DB_SECRET_ARN
              value: ${WORKER_DB_SECRET_ARN}
            - name: WORKER_SQS_QUEUE_URL
              value: ${WORKER_SQS_QUEUE_URL}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
