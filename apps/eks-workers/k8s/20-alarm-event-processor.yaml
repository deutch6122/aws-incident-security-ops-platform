# Worker_Alarm. Non-root, read-only root filesystem, resource requests/limits.
# Environment carries only non-secret values (Secrets Manager ARN + region +
# queue URL). No DB password, no base64 Secret is present here; the pod reads the
# DB credential at runtime through the IRSA role's secretsmanager:GetSecretValue
# on the referenced ARN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alarm-event-processor
  namespace: workers
  labels:
    app.kubernetes.io/name: alarm-event-processor
    app.kubernetes.io/part-of: ops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alarm-event-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alarm-event-processor
        app.kubernetes.io/part-of: ops-platform
    spec:
      serviceAccountName: eks-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alarm-event-processor
          # Placeholder image reference. Replace ${ECR_WORKERS_IMAGE} with the
          # eks-workers ECR image URI at deploy time.
          image: ${ECR_WORKERS_IMAGE}
          command: ["python", "-m", "workers.entrypoints.alarm_event_processor"]
          env:
            - name: WORKER_AWS_REGION
              value: ap-northeast-1
            # ARN reference only (not a secret value).
            - name: WORKER_DB_SECRET_ARN
              value: ${WORKER_DB_SECRET_ARN}
            - name: WORKER_SQS_QUEUE_URL
              value: ${WORKER_SQS_QUEUE_URL}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
