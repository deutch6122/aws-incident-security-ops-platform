# Namespace for Product_A EKS workers. Must match the eks module Fargate profile
# selector (var.worker_namespace, default "workers") and the IRSA trust policy
# sub condition.
apiVersion: v1
kind: Namespace
metadata:
  name: workers
  labels:
    app.kubernetes.io/part-of: ops-platform
    platform: ops-platform-dev
---
# EKS Fargate requires this exact namespace and label for its built-in log
# router configuration. Apply this file before 40-fargate-logging.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: aws-observability
  labels:
    aws-observability: enabled
    platform: ops-platform-dev
