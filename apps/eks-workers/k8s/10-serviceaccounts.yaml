# ServiceAccounts bound to IRSA roles via the eks.amazonaws.com/role-arn
# annotation. The role ARNs are PLACEHOLDERS: substitute the eks module outputs
# worker_role_arn / cronjob_role_arn at deploy time. Do NOT commit real ARNs.
# See apps/eks-workers/README.md for the substitution method.
#
# The names below MUST match the eks module variables
# worker_service_account_name (default "eks-worker") and
# cronjob_service_account_name (default "eks-cronjob") so the OIDC sub condition
# matches.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eks-worker
  namespace: workers
  annotations:
    # Placeholder. Replace ${EKS_WORKER_ROLE_ARN} with the eks module output
    # worker_role_arn (arn:aws:iam::<account-id>:role/ops-platform-dev-eks-worker-role).
    eks.amazonaws.com/role-arn: ${EKS_WORKER_ROLE_ARN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eks-cronjob
  namespace: workers
  annotations:
    # Placeholder. Replace ${EKS_CRONJOB_ROLE_ARN} with the eks module output
    # cronjob_role_arn (arn:aws:iam::<account-id>:role/ops-platform-dev-eks-cronjob-role).
    eks.amazonaws.com/role-arn: ${EKS_CRONJOB_ROLE_ARN}
