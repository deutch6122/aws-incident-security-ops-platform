# ServiceAccounts bound to IRSA roles via the eks.amazonaws.com/role-arn
# annotation. The role ARNs are PLACEHOLDERS: substitute the eks module outputs
# alarm_worker_role_arn / finding_worker_role_arn / cronjob_role_arn at deploy
# time. Do NOT commit real ARNs.
# See apps/eks-workers/README.md for the substitution method.
#
# The names below MUST match the eks module variables
# alarm_worker_service_account_name (default "eks-alarm-worker"),
# finding_worker_service_account_name (default "eks-finding-worker"), and
# cronjob_service_account_name (default "eks-cronjob") so the OIDC sub condition
# matches.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eks-alarm-worker
  namespace: workers
  annotations:
    eks.amazonaws.com/role-arn: ${EKS_ALARM_WORKER_ROLE_ARN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eks-finding-worker
  namespace: workers
  annotations:
    eks.amazonaws.com/role-arn: ${EKS_FINDING_WORKER_ROLE_ARN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eks-cronjob
  namespace: workers
  annotations:
    eks.amazonaws.com/role-arn: ${EKS_CRONJOB_ROLE_ARN}
