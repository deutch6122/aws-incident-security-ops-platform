# EKS Fargate built-in log router configuration.
#
# This is the ONLY logging mechanism for the workers. There is NO Fluent Bit
# DaemonSet. Creating the aws-observability namespace with the aws-logging
# ConfigMap enables the Fargate built-in log router, which ships pod stdout/
# stderr to CloudWatch Logs. The eks module's Fargate pod execution role holds
# the logs:* permissions the router needs, and the eks module owns the target
# CloudWatch Logs group.
apiVersion: v1
kind: Namespace
metadata:
  name: aws-observability
  labels:
    aws-observability: enabled
    platform: ops-platform-dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-logging
  namespace: aws-observability
data:
  # region and log_group_name are placeholders substituted at deploy time to
  # match the eks module region and worker_log_group_name output.
  # (default log group: /ops-platform-dev/eks/workers)
  output.conf: |
    [OUTPUT]
        Name                cloudwatch_logs
        Match               *
        region              ${AWS_REGION}
        log_group_name      ${WORKER_LOG_GROUP_NAME}
        log_stream_prefix   fargate-
        auto_create_group   true
  parsers.conf: |
    [PARSER]
        Name                json
        Format              json
        Time_Key            time
        Time_Format         %Y-%m-%dT%H:%M:%S.%L%z
  filters.conf: |
    [FILTER]
        Name                parser
        Match               *
        Key_Name            log
        Parser              json
        Reserve_Data        true
